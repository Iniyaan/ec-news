name: Daily News Website Update

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news-page:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run news notifier script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_notifier.py
        
     - name: Publish the updated website page
        run: |
         git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily news page"
          git pull --rebase origin main
          git push
